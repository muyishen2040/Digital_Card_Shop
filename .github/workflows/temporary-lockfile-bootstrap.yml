name: Generate npm lockfile (temporary maintenance job)

on:
  push:
    branches: [chore/repository-maintenance]

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the maintenance branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Generate lockfile once on the maintenance branch
        shell: bash
        run: |
          set -euo pipefail
          if test -f package-lock.json; then
            echo "Lockfile already committed; no changes needed."
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
          git add -- package-lock.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: commit npm 11 dependency lockfile'
          git push origin HEAD:refs/heads/chore/repository-maintenance
